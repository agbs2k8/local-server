apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{ include "openhamclock.fullname" . }}

  labels:
    {{- include "openhamclock.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: Recreate

  selector:
    matchLabels:
      {{- include "openhamclock.selectorLabels" . | nindent 6 }}

  template:

    metadata:
      annotations:
        openhamclock/env-checksum: {{ .Values.envSecret.checksum | quote }}
      labels:
        {{- include "openhamclock.selectorLabels" . | nindent 8 }}

    spec:

      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}

      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:

        - name: openhamclock

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          
          ports:

            - name: http
              containerPort: 3000
              protocol: TCP

            {{- if .Values.service.wsjtx.enabled }}
            - name: wsjtx
              containerPort: {{ .Values.service.wsjtx.port }}
              protocol: UDP
            {{- end }}

            {{- if .Values.service.n1mm.enabled }}
            - name: n1mm
              containerPort: {{ .Values.service.n1mm.port }}
              protocol: UDP
            {{- end }}

          {{- if .Values.envSecret.name }}

          envFrom:

            - secretRef:
                name: {{ .Values.envSecret.name }}

          {{- end }}

          volumeMounts:

            - name: data
              mountPath: /data

          livenessProbe:

            httpGet:
              path: /api/health
              port: http

            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          readinessProbe:

            httpGet:
              path: /api/health
              port: http

            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:

        - name: data

          persistentVolumeClaim:
            claimName: {{ include "openhamclock.fullname" . }}