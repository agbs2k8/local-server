[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "weather-app"
version = "0.0.1"
description = "Extract & Compile Weather Data from Google Maps API for Trmnl App"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34",
    "pydantic>=2.13.5",
    "psycopg>=3.3.5"
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
